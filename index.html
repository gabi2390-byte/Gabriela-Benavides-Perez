<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Comida Saludable</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Header Section -->
  <header>
    <h1>🥗 Tienda de Comida Saludable</h1>
    <label for="categoria">Filtrar por categoría:</label>
    <select id="categoria" onchange="filtrarPorCategoria()">
      <option value="todos">Todos</option>
      <option value="frutas">Frutas</option>
      <option value="verduras">Verduras</option>
      <option value="snacks">Snacks</option>
    </select>
    <p>Encuentra los productos más frescos y saludables para tu dieta</p>
  </header>

  <!-- Product Section -->
  <section id="productos"></section>

  <!-- Cart Section -->
  <section class="carrito">
    <h2>🛒 Carrito de Compras</h2>
    <p><strong>Productos en carrito: <span id="cantidad-carrito">0</span></strong></p>
    <ul id="lista-carrito"></ul>
    <p><strong>Total: $<span id="total">0.00</span></strong></p>
    <button class="vaciar" onclick="vaciarCarrito()">🧼 Vaciar Carrito</button>
    <button class="finalizar" onclick="finalizarCompra()">✅ Finalizar Compra</button>

    <!-- PayPal Payment Section -->
    <div class="pago">
      <h3>💳 Método de pago</h3>
      <div id="paypal-button-container" style="margin-top: 10px; display: none;"></div>
    </div>
  </section>

  <!-- PayPal SDK -->
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD&components=buttons,funding-eligibility"></script>
  
  <!-- Custom Script -->
  <script src="script.js"></script>

</body>

</html>
